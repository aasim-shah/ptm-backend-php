# Self-contained production stack: app (PHP 8.2 + Apache) and its own MySQL.
# The app listens only on 127.0.0.1:${APP_PORT:-8091}; put a reverse proxy
# (Caddy/Nginx) with TLS in front of it.
#
#   cp .env.example .env.production   # fill in values; DB_HOST=db
#   echo "MYSQL_ROOT_PASSWORD=..." > .env.compose
#   docker compose -f docker-compose.prod.yml --env-file .env.compose up -d --build

name: ptm-candidate

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        WITH_GRPC: ${WITH_GRPC:-1}
    image: ptm-backend:candidate
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:${APP_PORT:-8091}:80"
    environment:
      DB_HOST_CHECK: db
      DB_USER_CHECK: ${DB_USERNAME}
      DB_PASS_CHECK: ${DB_PASSWORD}
    volumes:
      - ./.env.production:/var/www/html/.env
      - ptm-storage:/var/www/html/storage/app
      - ptm-logs:/var/www/html/storage/logs
      - clamav-data:/var/lib/clamav:ro
      - ./secrets/firebase-service-account.json:/var/www/html/storage/app/firebase/service-account.json:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health/live') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - ptm

  worker:
    image: ptm-backend:candidate
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/worker-entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "workspace", "--queue=workspace", "--sleep=3", "--timeout=120", "--max-time=3600"]
    volumes:
      - ./.env.production:/var/www/html/.env:ro
      - ptm-storage:/var/www/html/storage/app
      - ptm-logs:/var/www/html/storage/logs
      - clamav-data:/var/lib/clamav:ro
      - ./secrets/firebase-service-account.json:/var/www/html/storage/app/firebase/service-account.json:ro
    healthcheck:
      test: ["CMD", "php", "artisan", "workspace:health", "--component=worker"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - ptm

  scheduler:
    image: ptm-backend:candidate
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/worker-entrypoint.sh"]
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./.env.production:/var/www/html/.env:ro
      - ptm-storage:/var/www/html/storage/app
      - ptm-logs:/var/www/html/storage/logs
      - clamav-data:/var/lib/clamav:ro
    healthcheck:
      test: ["CMD", "php", "artisan", "workspace:health", "--component=scheduler"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - ptm

  # Chat realtime (Laravel Reverb). Caddy proxies only the client path /app/* to it;
  # the app container publishes over the private network at http://reverb:8080.
  reverb:
    image: ptm-backend:candidate
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/worker-entrypoint.sh"]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    # Host 8080 is taken by temporal-ui, so the host side is 8081 (Caddy: /app/* -> 127.0.0.1:8081).
    ports:
      - "127.0.0.1:${REVERB_HOST_PORT:-8081}:8080"
    volumes:
      - ./.env.production:/var/www/html/.env:ro
      - ptm-logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - ptm

  malware-definitions:
    image: ptm-backend:candidate
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["freshclam"]
    command: ["--daemon", "--foreground", "--stdout"]
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - ptm

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ptm-mysql:/var/lib/mysql
    networks:
      - ptm

volumes:
  ptm-storage:
  ptm-logs:
  ptm-mysql:
  clamav-data:

networks:
  ptm:
    name: ptm-candidate-network
